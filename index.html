        // writeInfo 把 udta 写进 moov 会让 moov 变大；若 moov 在 mdat 之前，mdat 后移，
        // 需把 stco 的样本偏移同步加上这个增量，否则播放错位。
        function rmxBumpChunkOffsets(bytes, delta) {
            if (!delta) return bytes;
            const moov = rmxFindBox(bytes, 0, bytes.length, 'moov');
            if (!moov) return bytes;
            const trak = rmxFindBox(bytes, moov.pos + 8, moov.pos + moov.size, 'trak');
            if (!trak) return bytes;
            const mdia = rmxFindBox(bytes, trak.pos + 8, trak.pos + trak.size, 'mdia');
            if (!mdia) return bytes;
            const minf = rmxFindBox(bytes, mdia.pos + 8, mdia.pos + mdia.size, 'minf');
            if (!minf) return bytes;
            const stbl = rmxFindBox(bytes, minf.pos + 8, minf.pos + minf.size, 'stbl');
            if (!stbl) return bytes;
            const co = rmxFindBox(bytes, stbl.pos + 8, stbl.pos + stbl.size, 'stco');
            if (!co) return bytes;
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const cnt = view.getUint32(co.pos + 12, false);
            for (let i = 0; i < cnt; i++) view.setUint32(co.pos + 16 + 4 * i, (view.getUint32(co.pos + 16 + 4 * i, false) + delta) >>> 0, false);
            return bytes;
        }
        function rmxMoovBeforeMdat(bytes) {
            const moov = rmxFindBox(bytes, 0, bytes.length, 'moov');
            const mdat = rmxFindBox(bytes, 0, bytes.length, 'mdat');
            if (!moov || !mdat) return false;
            return moov.pos < mdat.pos;
        }
        /* === MP4_REMUX_END === */

        async function encodeImageToSingleFrameMp4(sourceEl) {
            if (typeof MediaRecorder === 'undefined') {
                throw new Error('当前浏览器不支持 MediaRecorder（请用较新的 Chrome / Edge）');
            }
            const w = sourceEl.naturalWidth || sourceEl.width;
            const h = sourceEl.naturalHeight || sourceEl.height;
            if (!w || !h) throw new Error('无法获取主图尺寸');

            // mime 优先级：优先 MP4（写入 udta/meta），不支持则退回 WebM（Matroska Attachments）。
            // 第一项带音频 codec：在 Edge(Chromium) 下 isTypeSupported 返回 true 且能正常产出视频——
            // 画布流是纯视频（无音轨），浏览器仅录视频，音频 codec 无害（同目录 webp-gif 工具已验证）。
            const supportedMimes = [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            const preferredMime = supportedMimes.find(t => {
                try { return MediaRecorder.isTypeSupported(t); } catch (_) { return false; }
            });
            if (!preferredMime) throw new Error('浏览器不支持任何可用的视频录制格式');

            const cvs = document.createElement('canvas');
            cvs.width = w; cvs.height = h;
            const ctx = cvs.getContext('2d');

            // 录制帧率用低速 2fps：用户实测同目录 webp-gif 工具以「2fps + 2 张相同图(1 张复制而成)」成功生成 MP4，
            // 说明关键是「低速 + 真实时间间隔绘制 ≥2 帧」，而非帧内容差异。本函数复用同一节奏。
            const FPS = 2;
            const stream = cvs.captureStream(FPS);

            // 个别浏览器 isTypeSupported 返回 true 但构造 MediaRecorder 时拒绝（如音频 codec 与纯视频流不匹配），
            // 故按「优先 mime → 纯 mp4/webm → webm」依次尝试构造。
            const tryMimes = [preferredMime,
                preferredMime.includes('mp4') ? 'video/mp4' : 'video/webm',
                'video/webm'];
            let rec = null, usedMime = null;
            for (const mt of tryMimes) {
                try { rec = new MediaRecorder(stream, { mimeType: mt, videoBitsPerSecond: 3_000_000 }); usedMime = mt; break; }
                catch (_) {}
            }
            if (!rec) throw new Error('浏览器无法创建 MediaRecorder');
            const container = usedMime.includes('mp4') ? 'mp4' : 'webm';

            const chunks = [];
            rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
            const done = new Promise((resolve, reject) => {
                rec.onstop = () => resolve(new Blob(chunks, { type: usedMime }));
                rec.onerror = (e) => reject(e.error || new Error('录制失败'));
            });

            rec.start(100); // timeslice 周期性触发 dataavailable

            // rAF 绘制循环：按真实时间间隔（1000/FPS）绘制 ≥2 帧同一张图。
            // 用户实测：webp-gif 工具以「1 张图复制成 2 张一模一样的图、2fps」成功生成 MP4，
            // 故本工具同样画相同内容即可——第 1 帧是干净原图（=下游抽取的首帧，原图无损），
            // 之后每隔 interval 再画一次，确保编码器拿到 ≥2 个样本并写出合法流（不靠像素差异）。
            const MIN_FRAMES = 3;        // ≥2 帧留余量（webp-gif 验证 2 帧即可）
            const interval = 1000 / FPS; // 2fps → 500ms
            let rendered = 0;
            let lastDraw = performance.now();
            await new Promise((resolve) => {
                function frame(now) {
                    if (rendered === 0 || now - lastDraw >= interval) {
                        ctx.drawImage(sourceEl, 0, 0, w, h); // 每帧都画干净原图（相同内容）
                        rendered++;
                        lastDraw = now;
                    }
                    if (rendered < MIN_FRAMES) requestAnimationFrame(frame);
                    else resolve();
                }
                requestAnimationFrame(frame);
            });

            rec.stop();
            const blob = await done;
            if (!blob || blob.size === 0) {
                throw new Error('录制产出为空（浏览器未返回任何视频数据）：请用 Chrome/Edge 录制 MP4，或 Firefox/Safari 录制 WebM');
            }
            const buffer = await blob.arrayBuffer();
            return { buffer, container };
        }

        // 把当前资源瀑布流以 base64 嵌进单帧 MP4，并触发下载
        async function downloadEmbedVideo() {
            if (!displayImg.src) return;
            setLoading(true);
            setStatus('正在编码单帧视频并嵌入资源...');
            try {
                const enc = await encodeImageToSingleFrameMp4(displayImg);
                let outBytes = new Uint8Array(enc.buffer);
                // 以真实字节头（魔术字）判定容器：浏览器（部分 Chrome/Edge、Safari 版本）可能在声明 mp4 时
                // 实际产出 WebM；若轻信请求的 mimeType 去重封装，会报“缺少 moov 且无法解析分片”。故统一按字节分流。
                const looksWebm = outBytes.length >= 4
                    && outBytes[0] === 0x1A && outBytes[1] === 0x45 && outBytes[2] === 0xDF && outBytes[3] === 0xA3;
                const looksMp4 = !looksWebm && outBytes.length >= 12
                    && String.fromCharCode(outBytes[4], outBytes[5], outBytes[6], outBytes[7]) === 'ftyp';
                if (looksMp4) {
                    // 分片 MP4 没有顶层 moov，Mp4InfoHandler 无法写入资源；先重封装成带 moov 的标准 MP4
                    const w = displayImg.naturalWidth || displayImg.width || 0;
                    const h = displayImg.naturalHeight || displayImg.height || 0;
                    const normalized = normalizeFragmentedMp4(outBytes, w, h);
                    if (normalized) outBytes = normalized;
                } else if (!looksWebm) {
                    const head = Array.from(outBytes.subarray(0, 16)).map(b => b.toString(16).padStart(2, '0')).join(' ');
                    throw new Error('无法识别录制的视频容器（前 16 字节: ' + head + '），请用 Chrome/Edge 录制 MP4 或 Firefox/Safari 录制 WebM');
                }
                const isWebm = looksWebm;
                if (currentAttachments.length > 0) {
                    const payload = JSON.stringify(currentAttachments.map(a => ({
                        type: a.type, mime: a.mime, data: a.data,
                        keyword: a.keyword, filename: a.filename, size: a.size
                    })));
                    const handler = getInfoHandler(outBytes);
                    const before = outBytes.length;
                    outBytes = handler.writeInfo(outBytes, [{ key: 'resources', value: payload, type: 1 }]);
                    // moov 在 mdat 之前时，写入 udta 让 moov 变大、mdat 后移，需同步 stco 偏移
                    if (rmxMoovBeforeMdat(outBytes)) {
                        const delta = outBytes.length - before;
                        if (delta) outBytes = rmxBumpChunkOffsets(outBytes, delta);
                    }
                }
                // isWebm 已按真实字节头（looksWebm）在上文判定，不再依赖 enc.container
                const blob = new Blob([outBytes], { type: isWebm ? 'video/webm' : 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const base = lastMainFileName ? lastMainFileName.replace(/\.[^.]+$/, '') : 'output';
                const a = document.createElement('a');
                a.href = url;
                a.download = base + '_embed.' + (isWebm ? 'webm' : 'mp4');
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setStatus('已下载嵌入视频（含 ' + currentAttachments.length + ' 个资源）');
            } catch (e) {
                console.error(e);
                setStatus('❌ 生成失败：' + (e && e.message ? e.message : e));
            }
            setLoading(false);
        }

        // 读取本工具生成的嵌入视频，把其中的 resources 还原到瀑布流
        async function readEmbedVideo(file) {
            if (!file) return;
            try {
                setStatus('读取嵌入视频...');
                const bytes = new Uint8Array(await file.arrayBuffer());
                const info = getInfoHandler(bytes).readInfo(bytes);
                const res = info && info.find(e => e.key === 'resources');
                if (!res) { setStatus('该视频没有可读取的嵌入资源'); return; }
                currentAttachments = JSON.parse(res.value);
                userHasModifiedResources = false;
                isVideoEmbedMode = false; // 解码后回到图片嵌入态
                renderWaterfall();
                updateEmbedUI();
                setStatus('已读取 ' + currentAttachments.length + ' 个嵌入资源到瀑布流');
            } catch (e) {
                console.error(e);
                setStatus('❌ 读取失败：' + (e && e.message ? e.message : e));
            }
        }

        // Smart Download Logic
        btnDownload.onclick = () => {
            if (isVideoEmbedMode) { downloadEmbedVideo(); return; }
            if(!displayImg.src) return;
            setLoading(true);
            setStatus('正在打包资源并下载...');
            
            const img = displayImg;
            const cvs = document.createElement('canvas');
            const w = cvs.width = img.naturalWidth || img.width;
            const h = cvs.height = img.naturalHeight || img.height;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // Get base PNG data
            cvs.toBlob(pngBlob => {
                const r = new FileReader();
                r.onload = () => {
                    let bytes = new Uint8Array(r.result);

                    if(currentAttachments.length > 0) {
                        bytes = PngInfoHandler.addMultipleInfo(bytes, currentAttachments);
                    }
                    else if(sourceUnknownTextChunks&&!userHasModifiedResources){
                        bytes = PngInfoHandler.addMultipleInfo(bytes, sourceUnknownTextChunks);
                    }

                    const finalBlob = new Blob([bytes], {type:'image/png'});
                    const url = URL.createObjectURL(finalBlob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'output_with_resources.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    setLoading(false);
                    setStatus('已下载 (含 ' + currentAttachments.length + ' 个资源)');
                };
                r.readAsArrayBuffer(pngBlob);
            }, 'image/png');
        };

        // 视频嵌入模式按钮
        if (btnVembed) btnVembed.addEventListener('click', () => downloadEmbedVideo());
        if (embedInput) embedInput.addEventListener('change', (e) => {

            e.target.value = ''; // 允许重复选择同一文件
        });

        // --- MODAL LOGIC ---
        
        function updateModalNavVisibility() {
            if(currentAttachments.length > 1) {
                modalPrev.style.display = 'flex';
                modalNext.style.display = 'flex';
            } else {
                modalPrev.style.display = 'none';
                modalNext.style.display = 'none';
            }
        }

        function renderModalContent(idx) {
            if(!currentAttachments[idx]) return closeModal();
            const a = currentAttachments[idx]; 
            const src = `data:${a.mime};base64,${a.data}`; 
            modalBody.innerHTML = '';
            
            let element;
            if(a.type === 'image') { 
                element = document.createElement('img'); element.src = src; 
            } else if(a.type === 'video') { 
                element = document.createElement('video'); element.src = src; element.controls = true; element.autoplay = true; 
            } else { 
                element = document.createElement('pre'); try{element.textContent=atob(a.data);}catch(e){element.textContent=a.data;} 
            }
            modalBody.appendChild(element);
            currentModalIndex = idx;
        }

        function openModal(idx) {
            if(!currentAttachments[idx]) return;
            currentModalIndex = idx;
            updateModalNavVisibility();
            renderModalContent(idx);
            modalOverlay.classList.add('active');
        }

        function closeModal() { 
            modalOverlay.classList.remove('active'); 
            modalBody.innerHTML = ''; // Stop videos
        }

        // Modal Event Listeners
        modalClose.onclick = closeModal;
        modalClickCloseLayer.onclick = closeModal;
        modalPrev.onclick = (e) => {
            e.stopPropagation();
            if(currentAttachments.length <= 1) return;
            let nextIdx = currentModalIndex - 1;
            if(nextIdx < 0) nextIdx = currentAttachments.length - 1;
            renderModalContent(nextIdx);
        };

        modalNext.onclick = (e) => {
            e.stopPropagation();
            if(currentAttachments.length <= 1) return;
            let nextIdx = currentModalIndex + 1;
            if(nextIdx >= currentAttachments.length) nextIdx = 0;
            renderModalContent(nextIdx);
        };

        document.addEventListener('keydown', (e) => {
            if(!modalOverlay.classList.contains('active')) return;
            if(e.key === 'Escape') closeModal();
            if(e.key === 'ArrowLeft') modalPrev.click();
            if(e.key === 'ArrowRight') modalNext.click();
        });

        dropZone.ondrop=e=>{e.preventDefault(); dropZone.classList.remove('drag-over'); if(e.dataTransfer.files.length) { setLoading(true); handleMainFile(e.dataTransfer.files[0]); }};

        btnDecrypt.onclick = () => processImage('decrypt');

        // --- PASTE SUPPORT (Ctrl+V) ---
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            const files = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    files.push(items[i].getAsFile());
                }
            }

            if (files.length === 0) return;

            // Check active view
            const isMainView = viewMain.classList.contains('active-view');
            
            if (isMainView) {
                // Handle as main file
                setLoading(true);
                handleMainFile(files[0],()=>{
                    if(!gestureToggle.checked)return;
                    setTimeout(() => {
                        if (currentGestureDirection === 'ltr') {
                            processImage('decrypt'); // 左→右：还原
                        } else {
                            processImage('encrypt'); // 右→左：混淆
                        }
                    }, 100);
                });
            } else {
                // Handle as resources
                processAttachments(files);
            }
        });

        // 添加按钮事件监听（放在原有 paste 事件之后）
        document.getElementById('main-paste-btn').addEventListener('click', async () => {
            try {
                await readClipboard();
            } catch (err) {
                console.error('读取剪贴板失败:', err);
                // 降级提示：让用户手动粘贴
                if (err.name === 'NotAllowedError') {
                    alert('请允许剪贴板权限，或使用 Ctrl+V 直接粘贴');
                } else if (err.name === 'TypeError' || !navigator.clipboard) {
                    alert('您的浏览器不支持主动读取剪贴板，请使用 Ctrl+V 直接粘贴');
                }
            }
        });

        // 主动读取剪贴板函数
        async function readClipboard() {
            // 检查浏览器支持
            if (!navigator.clipboard || !navigator.clipboard.read) {
                throw new Error('Clipboard API not supported');
            }

            // 检查是否为安全上下文 (HTTPS 或 localhost)
            if (!window.isSecureContext) {
                throw new Error('必须在 HTTPS 或 localhost 环境下使用');
            }

            // 请求权限（Chrome/Edge 需要）
            if (navigator.permissions) {
                try {
                    const permission = await navigator.permissions.query({ 
                        name: 'clipboard-read' 
                    });
                    
                    if (permission.state === 'denied') {
                        throw new Error('剪贴板读取权限被拒绝');
                    }
                } catch (e) {
                    // Firefox 不支持 clipboard-read 权限查询，继续尝试读取
                    console.log('权限查询失败，尝试直接读取:', e);
                }
            }

            // 读取剪贴板内容
            const clipboardItems = await navigator.clipboard.read();
            const files = [];

            for (const item of clipboardItems) {
                // 检查所有可用的类型
                for (const type of item.types) {
                    if (type.startsWith('image/')) {
                        const blob = await item.getType(type);
                        // 将 blob 转换为 File 对象，以便复用原有逻辑
                        const file = new File([blob], `clipboard-image.${type.split('/')[1]}`, { 
                            type: type 
                        });
                        files.push(file);
                    }
                }
            }

            if (files.length === 0) {
                console.log('剪贴板中没有图片文件');
                return;
            }

            // 复用原有逻辑处理文件
            handleClipboardFiles(files);
        }

        // 封装原有处理逻辑，方便复用
        function handleClipboardFiles(files) {
            // Check active view
            const isMainView = viewMain.classList.contains('active-view');
            
            if (isMainView) {
                // Handle as main file
                setLoading(true);
                handleMainFile(files[0], () => {
                    if (!gestureToggle.checked) return;
                    setTimeout(() => {
                        if (currentGestureDirection === 'ltr') {
                            processImage('decrypt'); // 左→右：还原
                        } else {
                            processImage('encrypt'); // 右→左：混淆
                        }
                    }, 100);
                });
            } else {
                // Handle as resources
                processAttachments(files);
            }
        }

        let guideSteps = [];

            const css = `/* 帮助按钮样式 */

                /* 高亮区域 */
                .highlight-area {

                /* 引导提示框样式 - 宽度固定，高度自适应 */
                .highlight-tooltip {
                    position: absolute;

                }

                .highlight-tooltip::after {
                    content: '';

                /* 上方提示框 */
                .highlight-tooltip.tooltip-top::after {
                    bottom: -16px;

                }

                /* 下方提示框 */
                .highlight-tooltip.tooltip-bottom::after {

                .guide-tooltip-buttons {

            let style = document.createElement('style');

        function showGuideOverlay() {
            // 移除现有的高亮元素
            const existingHighlight = document.querySelector('.highlight-area');
            if (existingHighlight) existingHighlight.remove();

            const existingTooltip = document.querySelector('.highlight-tooltip');
            if (existingTooltip) existingTooltip.remove();

            if (currentStep >= guideSteps.length) {
                // 引导结束
                return;
            }

            const step = guideSteps[currentStep];
            const element = step.element;
            
            // --- 修复 1：获取当前页面的滚动偏移量 ---
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const scrollLeft = window.scrollX || document.documentElement.scrollLeft;

            const rect = element.getBoundingClientRect();

            // 创建高亮区域
            const highlight = document.createElement('div');
            highlight.className = 'highlight-area';
            
            // --- 修复 2：在设置 top/left 时加上滚动偏移量 ---
            // 这样 absolute 定位的位置才是相对于文档的正确位置
            highlight.style.left = (rect.left + scrollLeft) + 'px';
            highlight.style.top = (rect.top + scrollTop) + 'px';
            highlight.style.width = rect.width + 'px';
            highlight.style.height = rect.height + 'px';
            document.body.appendChild(highlight);

            // 创建提示信息
            const tooltip = document.createElement('div');
            tooltip.className = `highlight-tooltip tooltip-${step.position}`;
            
            // 创建按钮HTML
            let buttonsHTML = '<div class="guide-tooltip-buttons">';
            if (currentStep > 0) {
                buttonsHTML += '<button class="guide-tooltip-button prev-tooltip-button" id="prevGuideTooltip">上一步</button>';
            }
            
            if (currentStep < guideSteps.length - 1) {
                buttonsHTML += '<button class="guide-tooltip-button next-tooltip-button" id="nextGuideTooltip">下一步</button>';
            } else {
                buttonsHTML += '<button class="guide-tooltip-button finish-tooltip-button" id="finishGuideTooltip">完成</button>';
            }
            
            buttonsHTML += '<button class="guide-tooltip-button skip-tooltip-button" id="skipGuideTooltip">跳过</button>';
            buttonsHTML += '</div>';
            
            // 设置提示内容，支持\n换行
            tooltip.innerHTML = `<div class="guide-message">${step.message}</div>${buttonsHTML}`;
            
            // 如果有action，执行它
            if (step.action) {
                step.action();
            }
            
            // 将提示框添加到DOM
            document.body.appendChild(tooltip);
            
            // 计算提示框位置
            const tooltipWidth = 300; // 固定宽度
            const tooltipHeight = tooltip.offsetHeight;
            const spacing = 15; // 高亮区域和提示框的间距

            // --- 修复 3：修正提示框的定位逻辑 ---
            
            // 先计算相对于视口的理想 Left 位置 (确保不出屏幕左右边界)
            // rect.left 是相对于视口的，所以这里先算视口内的相对位置
            let visualLeft = rect.left + rect.width / 2 - tooltipWidth / 2;
            
            // 限制在视口范围内 (左右各留10px边距)
            visualLeft = Math.max(10, Math.min(visualLeft, window.innerWidth - tooltipWidth - 10));
            
            // 最终转换为文档坐标 (加上 scrollLeft)
            tooltip.style.left = (visualLeft + scrollLeft) + 'px';

            if (step.position === 'bottom') {
                // 提示框在下方：元素的 rect.bottom (视口) + 间距 + 滚动偏移
                tooltip.style.top = (rect.bottom + spacing + scrollTop) + 'px';
            } else {
                // 提示框在上方：元素的 rect.top (视口) - 高度 - 间距 + 滚动偏移
                // 注意：Math.max 是为了防止上方空间不足导致跑到屏幕最顶端上方，这里也要加上 scrollTop
                let visualTop = Math.max(10, rect.top - tooltipHeight - spacing);
                tooltip.style.top = (visualTop + scrollTop) + 'px';
            }
            
            // --- 可选优化：确保元素在视口内 ---
            // 如果元素不在当前视口，滚动页面将其展示出来（建议加上）
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 添加按钮事件监听器
            const addButtonListeners = () => {
                const prevBtn = document.getElementById('prevGuideTooltip');
                const nextBtn = document.getElementById('nextGuideTooltip');
                const finishBtn = document.getElementById('finishGuideTooltip');
                const skipBtn = document.getElementById('skipGuideTooltip');
                
                if (prevBtn) {
                    prevBtn.addEventListener('click', () => {
                        currentStep--;
                        document.body.removeChild(highlight);
                        document.body.removeChild(tooltip);
                        showGuideOverlay();
                    });
                }
                
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        currentStep++;
                        document.body.removeChild(highlight);
                        document.body.removeChild(tooltip);
                        showGuideOverlay();
                    });
                }
                
                if (finishBtn) {
                    finishBtn.addEventListener('click', () => {
                        document.body.removeChild(highlight);
                        document.body.removeChild(tooltip);
                        currentStep = guideSteps.length;
                    });
                }
                
                if (skipBtn) {
                    skipBtn.addEventListener('click', () => {
                        document.body.removeChild(highlight);
                        document.body.removeChild(tooltip);
                        currentStep = guideSteps.length;
                    });
                }
            };
            
            setTimeout(addButtonListeners, 0);
        }
